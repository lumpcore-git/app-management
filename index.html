<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMP CORE - ログイン</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=27">
  <link rel="stylesheet" href="css/components.css?v=27">
</head>
<body>

<!-- ── ICON SPRITE (Tabler Icons, outline, inline — no CDN dependency) ── -->
<svg style="display:none" aria-hidden="true">
  <symbol id="ic-building" viewBox="0 0 24 24">
    <path d="M3 21l18 0" />
    <path d="M9 8l1 0" />
    <path d="M9 12l1 0" />
    <path d="M9 16l1 0" />
    <path d="M14 8l1 0" />
    <path d="M14 12l1 0" />
    <path d="M14 16l1 0" />
    <path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16" />
  </symbol>
</svg>

<div class="login-bg">
  <div class="login-card">

    <div class="login-logo">LUMP<span>CORE</span></div>
    <div class="login-sub">モバイル事業 実績管理システム</div>

    <div class="login-error" id="loginError"></div>

    <div class="form-group">
      <label class="form-label">ユーザー名</label>
      <select class="form-select" id="loginUser">
        <option value="">-- ユーザーを選択してください --</option>
      </select>
    </div>

    <div class="form-group" style="margin-top:16px">
      <label class="form-label">パスワード</label>
      <input type="password" class="form-input" id="loginPw"
        placeholder="パスワードを入力"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>

    <button class="btn btn-primary"
      style="width:100%;margin-top:24px;padding:12px;font-size:15px;justify-content:center"
      onclick="doLogin()">
      ログイン
    </button>

    <div style="display:flex;align-items:center;gap:8px;margin-top:20px;color:var(--text-sub);font-size:13px">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      または
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>

    <button class="btn"
      style="width:100%;margin-top:12px;padding:12px;font-size:15px;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--text)"
      onclick="loginWithEntraId()">
      <svg class="ico"><use href="#ic-building"></use></svg> Microsoft アカウントでログイン
    </button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.21.0/lib/msal-browser.min.js"></script>
<script src="js/data.js?v=27"></script>
<script src="js/auth.js?v=27"></script>
<script>

  // すでにログイン済みならアプリへ
  initData();
  if (getSession()) {
    location.href = 'app.html';
  } else {
    // Entra ID (MSAL.js) のリダイレクト帰り、または既存セッションをチェックしてアプリへ
    tryEntraIdLogin().then((result) => {
      if (getSession()) {
        location.href = 'app.html';
      } else if (result && result.reason === 'no_match') {
        showError(`このMicrosoftアカウント（${result.email}）に一致する社員が見つかりませんでした。メンバー管理でのメールアドレス登録を確認してください。`);
      }
    });
  }

  // ユーザー一覧をドロップダウンに追加
  (function populateUsers() {
    const users = getUsers();
    const sel = document.getElementById('loginUser');
    // 役職レベル順（強い順）にソート
    const sorted = [...users].sort((a, b) =>
      (ROLES[b.role]?.level || 0) - (ROLES[a.role]?.level || 0)
    );
    sorted.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.name}　（${ROLES[u.role]?.label || u.role}）`;
      sel.appendChild(opt);
    });
  })();

  function doLogin() {
    const userId = document.getElementById('loginUser').value;
    const pw     = document.getElementById('loginPw').value;

    if (!userId) { showError('ユーザーを選択してください'); return; }
    if (!pw)     { showError('パスワードを入力してください'); return; }

    const result = login(userId, pw);
    if (result.ok) {
      location.href = 'app.html';
    } else {
      showError(result.error);
    }
  }

  function showError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.style.display = 'block';
  }

</script>
</body>
</html>
