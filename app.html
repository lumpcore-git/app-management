<div id="impersonationBar" class="impersonation-bar hidden"></div>

<div class="layout">

  <!-- ── TOPBAR ── -->
  <header class="topbar">
    <div class="topbar-logo" onclick="navigate('dashboard')" title="ホームへ">LUMP<span>CORE</span></div>
    <div class="topbar-title" id="topbarTitle">ダッシュボード</div>
    <div class="topbar-right">
      <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="テーマ切替"></button>
      <div style="position:relative">
        <button class="notif-bell-btn" id="notifBellBtn" onclick="navigate('dashboard')" title="お知らせ"><svg class="ico"><use href="#ic-bell"></use></svg></button>
        <span class="notif-badge hidden" id="notifBadge"></span>
      </div>
      <div class="topbar-user person-link" onclick="navigate('myprofile')" title="プロフィール">
        <div class="avatar-sm" id="topbarAvatar"></div>
        <div>
          <div class="topbar-name" id="topbarName"></div>
          <div class="topbar-role" id="topbarRoleLabel"></div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
      <button class="hamburger-btn" id="hamburgerMenuBtn" onclick="toggleHamburgerMenu()" title="メニュー"><svg class="ico"><use href="#ic-menu-2"></use></svg></button>
    </div>
  </header>

  <!-- ── SIDEBAR ── -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- ── MAIN ── -->
  <main class="main" id="main"></main>

</div>

<!-- ── BOTTOM NAV (mobile) ── -->
<div id="bottomnav" class="bottomnav"></div>

<!-- ── HAMBURGER MENU (mobile) ── -->
<div id="hamburgerOverlay" class="hamburger-overlay hidden" onclick="if(event.target===this) closeHamburgerMenu()">
  <nav class="hamburger-panel">
    <div class="hamburger-panel-head">
      <div class="hamburger-panel-title">LUMP<span>CORE</span></div>
      <button class="hamburger-panel-close" onclick="closeHamburgerMenu()"><svg class="ico"><use href="#ic-x"></use></svg></button>
    </div>
    <div id="hamburgerMenuPanel" class="hamburger-panel-list"></div>
  </nav>
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>
